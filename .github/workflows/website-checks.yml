name: Website checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/check-website.mjs'
      - 'package*.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - '.github/workflows/website-checks.yml'
permissions:
  contents: read
concurrency:
  group: website-checks
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HG_CONTACT_FORM_ENABLED: 'false'
      HG_INSTAGRAM_ENABLED: 'false'
      HG_PUBLIC_INDEXING: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npm run typecheck
      - name: Verify local logo files
        run: python3 scripts/import_partner_logos.py --check
      - name: Install temporary browser test tool
        run: npm install --prefix "$RUNNER_TEMP/hg-browser" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Check routes, headers and responsive layout
        env:
          HG_BROWSER_MODULE: ${{ runner.temp }}/hg-browser/node_modules/playwright/index.mjs
        run: node --experimental-strip-types scripts/check-website.mjs
