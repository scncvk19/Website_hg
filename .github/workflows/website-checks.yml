name: Website checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - '.github/workflows/website-checks.yml'
permissions:
  contents: read
concurrency:
  group: website-checks
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HG_CONTACT_FORM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --include=dev --no-audit --no-fund; else npm install --include=dev --no-audit --no-fund; fi
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npm run typecheck
      - name: Verify local logo files
        run: python3 scripts/import_partner_logos.py --check
